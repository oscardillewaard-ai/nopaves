# De vooraf bewerkte routegraaf (regio Delft) wekelijks opnieuw bouwen en als pull request aanbieden.
# Bron: het OpenStreetMap-extract van Geofabrik (Zuid-Holland), BGT en AHN van PDOK.
# Zie docs/GRAAF-PROEF.md en tools/graaf/bouw.mjs.
#
# Vereist: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# Vóór de PR draaien hier de echte tests op de net gebouwde graaf: unit-tests, het ondergrondoordeel
# tegen de app (eis >= 98%, zoals docs/GRAAF-PROEF.md) en Playwright telefoon en desktop (met de
# ?graaf=vooraf-stappen). Faalt er iets, dan komt er geen PR. Een PR die met GITHUB_TOKEN is gemaakt
# start "test" niet vanzelf; daarom start deze workflow "test" daarna zelf op de PR-branch.
name: Graaf bouwen

on:
  schedule:
    - cron: '17 3 * * 1' # maandag 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: graaf
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install osmium

      # BGT-tegels (max 30 dagen oud) en AHN-blokken bewaren tussen de runs: zo halen we bij PDOK
      # alleen op wat verouderd is, niet elke week alles opnieuw.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/nopaves-graaf
          key: graaf-${{ github.run_id }}
          restore-keys: graaf-

      # Geofabrik hapert soms (502, of een doorverwijslus). Daarom: een paar keer opnieuw proberen, en
      # anders het extract uit de cache van een vorige run (hooguit 14 dagen oud), met een waarschuwing.
      - name: OpenStreetMap-extract ophalen (Geofabrik)
        run: |
          mkdir -p ~/osm ~/.cache/nopaves-graaf/osm
          URL=https://download.geofabrik.de/europe/netherlands/zuid-holland-latest.osm.pbf
          OUD=~/.cache/nopaves-graaf/osm/zh.osm.pbf
          if curl -fsSL --retry 6 --retry-delay 60 --retry-all-errors --max-redirs 10 -o ~/osm/zh.osm.pbf "$URL"; then
            cp ~/osm/zh.osm.pbf "$OUD"
          elif [ -f "$OUD" ] && [ $(( ($(date +%s) - $(stat -c %Y "$OUD")) / 86400 )) -le 14 ]; then
            echo "::warning::Geofabrik niet bereikbaar; extract uit de cache van $(date -u -r "$OUD" +%F)"
            cp "$OUD" ~/osm/zh.osm.pbf
          else
            echo "::error::Geofabrik niet bereikbaar en geen extract van hooguit 14 dagen in de cache"
            exit 1
          fi
          ls -l ~/osm

      - name: Bijsnijden tot de regio
        run: |
          BBOX=$(node -e "console.log(require('./tools/graaf/regio.json').bbox_lonlat.join(' '))")
          python3 -I tools/graaf/bron_pbf.py ~/osm/zh.osm.pbf ~/osm/regio.ndjson $BBOX

      - name: Graaf bouwen
        run: |
          # uniek per run: blokken staan onder hun versie in de datacache van de browser, dus een
          # tweede bouw op dezelfde dag mag nooit dezelfde map gebruiken
          VERSIE=v$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}
          if git ls-tree -d --name-only HEAD "public/graaf/$VERSIE" | grep -q .; then echo "Versie $VERSIE bestaat al"; exit 1; fi
          echo "VERSIE=$VERSIE" >> $GITHUB_ENV
          node --max-old-space-size=12000 tools/graaf/bouw.mjs --bron ~/osm/regio.ndjson --versie $VERSIE

      - run: npm ci

      - name: Unit-tests
        run: npm run test:unit

      - name: Ondergrondoordeel tegen de app (eis >= 98%)
        run: NODE_USE_ENV_PROXY=1 OORDEEL_MIN=98 node --max-old-space-size=8000 tools/graaf/vergelijk_oordeel.mjs oordeel.json

      - name: Chromium voor Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright telefoon en desktop op de nieuwe graaf
        run: |
          python3 tools/serve.py 8765 &
          for i in $(seq 1 20); do curl -fs http://localhost:8765/nopaves/graaf/actueel.json | grep -q "\"$VERSIE\"" && break; sleep 0.5; done
          npm run test:mobiel
          npm run test:desktop

      - name: Oude versies weg, nieuwe versie als pull request
        run: |
          cd public/graaf
          for d in v*/; do [ "${d%/}" != "$VERSIE" ] && git rm -rq "$d" || true; done
          cd -
          git add public/graaf
          if git diff --cached --quiet; then echo "Geen wijzigingen in de graaf."; exit 0; fi
          TAK="chore/graaf-$VERSIE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TAK"
          git commit -m "chore: graaf $VERSIE (Geofabrik + BGT + AHN)"
          git push origin "$TAK"
          gh pr create --base main --head "$TAK" \
            --title "chore: graaf $VERSIE" \
            --body "$(printf 'Wekelijkse graafbouw (Geofabrik + BGT + AHN), versie %s.\n\nIn de bouw gedraaid op deze graaf: unit-tests, ondergrondoordeel tegen de app (%s%% van %s km gelijk, eis 98%%), Playwright telefoon en desktop. De workflow test draait hierna op deze branch.' "$VERSIE" "$(node -p "require('./oordeel.json').gelijkPct")" "$(node -p "require('./oordeel.json').km")")"
          gh workflow run test.yml --ref "$TAK"
        env:
          GH_TOKEN: ${{ github.token }}
