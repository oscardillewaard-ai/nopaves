# De vooraf bewerkte routegraaf (regio Delft) wekelijks opnieuw bouwen en als pull request aanbieden.
# Bron: het OpenStreetMap-extract van Geofabrik (Zuid-Holland), BGT en AHN van PDOK.
# Zie docs/GRAAF-PROEF.md en tools/graaf/bouw.mjs.
#
# Vereist: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# Een PR die met GITHUB_TOKEN is gemaakt start de workflow "test" niet vanzelf: de unit-tests draaien
# hieronder al; Playwright start je in de PR met "Run workflow" (test, op de PR-branch) of door de PR
# te sluiten en weer te openen.
name: Graaf bouwen

on:
  schedule:
    - cron: '17 3 * * 1' # maandag 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graaf
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install osmium

      # BGT-tegels (max 30 dagen oud) en AHN-blokken bewaren tussen de runs: zo halen we bij PDOK
      # alleen op wat verouderd is, niet elke week alles opnieuw.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nopaves-graaf
          key: graaf-${{ github.run_id }}
          restore-keys: graaf-

      - name: OpenStreetMap-extract ophalen (Geofabrik)
        run: |
          mkdir -p ~/osm
          curl -fsSL -o ~/osm/zh.osm.pbf https://download.geofabrik.de/europe/netherlands/zuid-holland-latest.osm.pbf
          ls -l ~/osm

      - name: Bijsnijden tot de regio
        run: |
          BBOX=$(node -e "console.log(require('./tools/graaf/regio.json').bbox_lonlat.join(' '))")
          python3 -I tools/graaf/bron_pbf.py ~/osm/zh.osm.pbf ~/osm/regio.ndjson $BBOX

      - name: Graaf bouwen
        run: |
          VERSIE=v$(date -u +%Y%m%d)
          echo "VERSIE=$VERSIE" >> $GITHUB_ENV
          node --max-old-space-size=12000 tools/graaf/bouw.mjs --bron ~/osm/regio.ndjson --versie $VERSIE

      - name: Tests
        run: node --test tests/test_web_kern.mjs

      - name: Oude versies weg, nieuwe versie als pull request
        run: |
          cd public/graaf
          for d in v*/; do [ "${d%/}" != "$VERSIE" ] && git rm -rq "$d" || true; done
          cd -
          git add public/graaf
          if git diff --cached --quiet; then echo "Geen wijzigingen in de graaf."; exit 0; fi
          TAK="chore/graaf-$VERSIE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TAK"
          git commit -m "chore: graaf $VERSIE (Geofabrik + BGT + AHN)"
          git push origin "$TAK"
          gh pr create --base main --head "$TAK" \
            --title "chore: graaf $VERSIE" \
            --body "Wekelijkse graafbouw (Geofabrik + BGT + AHN), versie $VERSIE. Unit-tests zijn in de bouw gedraaid. Controleer de workflow test en de grootte van public/graaf voor het samenvoegen."
        env:
          GH_TOKEN: ${{ github.token }}
