# Publiceert public/ op GitHub Pages bij elke push naar main.
# Vereist: Settings -> Pages -> Source: "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # De graaf voor heel NL staat buiten git (release-bijlage); alleen als public/graaf-nl/goedgekeurd.txt
      # een versie noemt, komt hij in de site. Zonder dat bestand verandert er niets.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Graaf heel NL uit de release (alleen met public/graaf-nl/goedgekeurd.txt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/graaf/haal_release.sh public/graaf-nl
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
